<style>

/* IMPORTANT FIX */

  flex:1;

body{

  height:100vh;

#chat{

  flex-direction:column;

.header{
background:#075e54;

background:#25D366;

font-size:12px;

padding-left:10px;
}
  html, body{
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:#ece5dd;
}

#chat{
  position:fixed;
  inset:0;
  display:none;
  flex-direction:column;
  height: calc(var(--vh, 1vh) * 100);
}

.header{
  flex:0 0 auto;
}

.messages{
  flex:1 1 auto;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.inputBox{
  flex:0 0 auto;
  display:flex;
  padding:10px;
  background:white;
  
}
  /* reaction bar */
.reactBar{
  position:absolute;
  bottom:100%;
  left:10px;
  background:white;
  border-radius:20px;
  padding:6px 8px;
  display:flex;
  gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
  z-index:5;
}

.reactBar span{
  font-size:18px;
}

.msg{
  position:relative;
}

/* show reactions under msg */
.reacts{
  font-size:14px;
  margin-top:4px;
}
</style>
</head>

<body>

<!-- 🔥 SPLASH -->
<div id="splash">
<div class="logo">K</div>
<h2>Kabutar Chat</h2>
<p>Made by Rohan - BCA 2nd Year</p>
</div>

<!-- LOGIN -->
<div id="login">
<div class="login-box">
<h2>KChat</h2>
<input id="name" placeholder="Name"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>
<button onclick="login()">Enter</button>
</div>
</div>

<!-- CHAT -->
<div id="chat">

<div class="header">
<div>
<div>KChat</div>
<div class="status" id="status"></div>
</div>
<button class="clearBtn" onclick="clearChat()">Clear</button>
</div>

<div class="messages" id="msgs"></div>
<div class="typing" id="typing"></div>

<div class="inputBox">
<input id="msg" placeholder="Message" oninput="typingSend()">
<button onclick="send()">Send</button>
</div>

</div>

<script>

/*
 Simple student-made realtime chat
 Modified by: Rohan (BCA 2nd Year)
 Notes: Thoda sa simple code style rakha hai, comments Hinglish me diye hai.
*/

// 🔥 SPLASH TIME CONTROL
setTimeout(()=>{
  // hide splash after thoda time
  document.getElementById("splash").style.display="none";
},1500);

// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAiXvw84M5j_6o5FntyhWyhAetHE1P5fOQ",
  authDomain: "realtime-chat-web-app-688d4.firebaseapp.com",
  databaseURL: "https://realtime-chat-web-app-688d4-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username=""; // user ka name store karega
const password="kabutar"; // simple password (student ne rakha)

// LOGIN function - yaha se app start hota hai
function login(){
  var name = document.getElementById("name").value.trim();
  var pass = document.getElementById("pass").value;

  if(!name){ alert("Enter name"); return; }
  if(pass !== password){ alert("Wrong password"); return; }

  username = name;

  // hide login and show chat
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";

  // ONLINE STATUS update
  db.ref("status/"+username).set("online");
  // jab user disconnect karega to offline set kar dena
  db.ref("status/"+username).onDisconnect().set("offline");

  // show status of other users live
  db.ref("status").on("child_changed", function(snap){
    var user = snap.key;
    var state = snap.val();

    if(user !== username){
      document.getElementById("status").innerText = state === "online" ? "🟢 Online" : "⚫ Offline";
    }
  });

  // first time load se bhi status dikhana
  db.ref("status").on("child_added", function(snap){
    var user = snap.key;
    var state = snap.val();

    if(user !== username){
      document.getElementById("status").innerText = state === "online" ? "🟢 Online" : "⚫ Offline";
    }
  });

  console.log(username + " logged in");
  load();
}

// SEND message function
function send(){
  var text = document.getElementById("msg").value;
  if(!text || !text.trim()) return;

  db.ref("chat").push({
    name: username,
    msg: text,
    seen: false
  });

  // clear input
  document.getElementById("msg").value = "";
  // remove typing indicator for this user
  db.ref("typing/"+username).set("");
  console.log('Message sent by ' + username);
}

// LOAD messages + blue tick + delete behavior
function load(){
  db.ref("chat").limitToLast(20).on("child_added", function(snap){
    var d = snap.val();
    var key = snap.key;

    var div = document.createElement("div");
    div.className = "msg " + (d.name===username?"me":"other");

    // ✔✔ BLUE TICK - agar message mera hai to ticks dikhayenge
    var tick = "";
    if(d.name === username){
      tick = d.seen ? '<span style="color:#34B7F1"> ✔✔</span>' : '<span style="color:gray"> ✔</span>';
    }

    // show message text aur tick
    div.innerHTML = d.msg + tick;

    // DELETE FOR EVERYONE on click - simple implementation
    div.onclick = function(){
      if(confirm("Delete for everyone?")){
        db.ref("chat/"+key).remove();
      }
    };

    document.getElementById("msgs").appendChild(div);
    // scroll to bottom - simple hack
    document.getElementById("msgs").scrollTop = 999999;

    // mark seen when dusra banda message bheje
    if(d.name !== username){
      db.ref("chat/"+key).update({seen:true});
    }
  });
}

// CLEAR CHAT - bahut simple
function clearChat(){
  if(confirm("Clear chat?")){
    db.ref("chat").remove();
    document.getElementById("msgs").innerHTML = "";
  }
}

// TYPING indicator
function typingSend(){
  // set typing to username for others to see
  db.ref("typing/"+username).set(username);

  // remove after 1s
  setTimeout(function(){
    db.ref("typing/"+username).set("");
  }, 1000);
}

// listen typing values
db.ref("typing").on("value", function(snap){
  var data = snap.val() || {};

  for(var user in data){
    if(user !== username && data[user]){
      document.getElementById("typing").innerText = user + " is typing...";
      return;
    }
  }
  document.getElementById("typing").innerText = "";
});

// fix vh for mobile browsers (student note: learned from tutorial)
function fixVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
fixVH();
window.addEventListener('resize', fixVH);

// reaction bar - add emoji reactions
function showReactions(div, key){
  var old = document.getElementById('reactBar');
  if(old) old.remove();

  var bar = document.createElement('div');
  bar.className = 'reactBar';
  bar.id = 'reactBar';

  var emojis = ['👍','❤️','😂','😮','😢','🙏'];

  emojis.forEach(function(e){
    var span = document.createElement('span');
    span.innerText = e;

    span.onclick = function(){
      db.ref('chat/'+key+'/reacts/'+username).set(e);
      bar.remove();
    };

    bar.appendChild(span);
  });

  div.appendChild(bar);
}

</script>

</body>
</html>
